<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Link Votati</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #linkInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        #linkInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #linkInput:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            opacity: 0.6;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }

        .ranking-title {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .ranking-item:hover {
            background: #f0f2f9;
            transform: translateX(5px);
        }

        .ranking-position {
            font-weight: bold;
            font-size: 18px;
            color: #667eea;
            min-width: 40px;
            text-align: center;
        }

        .ranking-link {
            flex: 1;
            margin-left: 15px;
            word-break: break-all;
        }

        .ranking-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .ranking-link a:hover {
            text-decoration: underline;
        }

        .ranking-votes {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
        }

        .vote-count {
            font-weight: bold;
            color: #333;
            min-width: 30px;
            text-align: center;
        }

        .vote-btn {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .vote-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-style: italic;
        }

        .user-status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .input-section {
                flex-direction: column;
            }

            .ranking-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .ranking-votes {
                margin-left: 0;
                margin-top: 10px;
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Classifica Link Votati</h1>

        <div class="message" id="message"></div>

        <div class="input-section">
            <input 
                type="text" 
                id="linkInput" 
                placeholder="Incolla un link qui..." 
                maxlength="2048"
            >
            <button id="addBtn">Aggiungi</button>
        </div>

        <div class="ranking-title">Top Link</div>
        <div class="ranking-list" id="rankingList">
            <div class="empty-message">Nessun link ancora. Sii il primo ad aggiungerne uno!</div>
        </div>

        <div class="user-status" id="userStatus"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        let userId = generateUserId();
        let allLinks = {};
        let userVotes = {};
        let db;

        function generateUserId() {
            let id = localStorage.getItem('user_id');
            if (!id) {
                id = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('user_id', id);
            }
            return id;
        }

        async function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyBHbxnh1O84iQ3NuUjWb4yP33O-b1cSjBY",
                authDomain: "votazione-siti.firebaseapp.com",
                projectId: "votazione-siti",
                storageBucket: "votazione-siti.firebasestorage.app",
                messagingSenderId: "909617632597",
                appId: "1:909617632597:web:947a40f0d2c7fda95e8bdc"
            };

            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);

            // Listener per i link
            onValue(ref(db, 'links'), (snapshot) => {
                allLinks = snapshot.val() || {};
                updateRanking();
            });

            // Listener per i voti dell'utente
            onValue(ref(db, 'votes/' + userId), (snapshot) => {
                userVotes = snapshot.val() || {};
                updateRanking();
                updateUserStatus();
            });

            // Check if user has a link
            const userLinkRef = ref(db, 'user_links/' + userId);
            const snapshot = await get(userLinkRef);
            if (snapshot.exists()) {
                document.getElementById('linkInput').disabled = true;
                document.getElementById('addBtn').disabled = true;
            }

            updateUserStatus();
        }

        function normalizeUrl(url) {
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            return url;
        }

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = 'message ' + type;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 4000);
        }

        async function addLink() {
            const input = document.getElementById('linkInput');
            let url = input.value.trim();

            if (!url) {
                showMessage('Per favore, incolla un link', 'error');
                return;
            }

            url = normalizeUrl(url);

            if (!isValidUrl(url)) {
                showMessage('Link non valido', 'error');
                return;
            }

            // Check if user already has a link
            const userLinkRef = ref(db, 'user_links/' + userId);
            const snapshot = await get(userLinkRef);
            if (snapshot.exists()) {
                showMessage('Hai già incollato un link. Puoi votare o aspettare il reset dei dati.', 'info');
                return;
            }

            const linkId = 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Save link
            await set(ref(db, 'links/' + linkId), {
                id: linkId,
                url: url,
                addedBy: userId,
                addedAt: new Date().toISOString(),
                votes: 0
            });

            // Save user link
            await set(ref(db, 'user_links/' + userId), linkId);

            input.value = '';
            input.disabled = true;
            document.getElementById('addBtn').disabled = true;

            showMessage('✓ Link aggiunto con successo!', 'success');
        }

        async function voteLink(linkId) {
            if (userVotes[linkId]) {
                showMessage('Hai già votato questo link', 'info');
                return;
            }

            const link = allLinks[linkId];
            if (link && link.addedBy === userId) {
                showMessage('Non puoi votare il tuo link', 'info');
                return;
            }

            if (link) {
                // Update votes
                await update(ref(db, 'links/' + linkId), {
                    votes: (link.votes || 0) + 1
                });

                // Save user vote
                await set(ref(db, 'votes/' + userId + '/' + linkId), true);

                showMessage('✓ Voto registrato!', 'success');
            }
        }

        function updateRanking() {
            const rankingList = document.getElementById('rankingList');

            const sortedLinks = Object.values(allLinks).sort((a, b) => b.votes - a.votes);

            if (sortedLinks.length === 0) {
                rankingList.innerHTML = '<div class="empty-message">Nessun link ancora. Sii il primo ad aggiungerne uno!</div>';
                return;
            }

            rankingList.innerHTML = sortedLinks.map((link, index) => {
                const userVoted = userVotes[link.id] || false;
                const isUserLink = link.addedBy === userId;

                return `
                    <div class="ranking-item">
                        <div class="ranking-position">#${index + 1}</div>
                        <div class="ranking-link">
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer">
                                ${link.url}
                            </a>
                        </div>
                        <div class="ranking-votes">
                            <div class="vote-count">${link.votes} ${link.votes === 1 ? 'voto' : 'voti'}</div>
                            <button 
                                class="vote-btn" 
                                onclick="window.voteLink('${link.id}')"
                                ${userVoted ? 'disabled' : ''}
                                ${isUserLink ? 'disabled' : ''}
                            >
                                ${userVoted ? '✓ Votato' : 'Vota'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateUserStatus() {
            const statusEl = document.getElementById('userStatus');
            
            const userLinkRef = ref(db, 'user_links/' + userId);
            const snapshot = await get(userLinkRef);
            
            if (snapshot.exists()) {
                const linkId = snapshot.val();
                const userLink = allLinks[linkId];
                if (userLink) {
                    statusEl.innerHTML = `✓ Hai incollato un link: <strong>${userLink.url}</strong><br>Non puoi aggiungere altri link. Puoi votare gli altri link.`;
                }
            } else {
                statusEl.innerHTML = 'Puoi aggiungere 1 link';
            }
        }

        // Expose functions to global scope
        window.voteLink = voteLink;

        document.getElementById('addBtn').addEventListener('click', addLink);
        document.getElementById('linkInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addLink();
            }
        });

        // Initialize Firebase
        initFirebase();
    </script>
</body>
</html>
